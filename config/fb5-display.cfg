# Native Flying Bear Ghost 5 display: ILI9488 480x320 on the FSMC bus
# of the MKS Robin Nano V1.x board (needs firmware with WANT_FSMC_LCD).

[fsmc_display]
# CS on PD7 = FSMC NE1, RS (D/C) on PD11 = FSMC A16
bank: 1
rs_line: 16
# Timings in HCLK cycles; 6/6 is what the MKS bootloader uses
address_setup: 6
data_setup: 6
reset_pin: PC6
backlight_pin: PD13
width: 480
height: 320
# MY | MX | MV | BGR: landscape as the MKS bootloader sets it on the FB5
# (Marlin's 0x28 shows the picture rotated by 180 degrees)
madctl: 0xE8
# Re-initialize the panel (Marlin ILI9488 sequence) whenever Klipper
# starts, with the tuned values below instead of the MKS bootloader ones
init_on_ready: True
# Panel tuning ("CMD DATA..." hex, replaces that command of the sequence)
# PWCTRL1/GVDD: 09 0B looked best (Marlin: 15 17, swept 01..1F)
# VMCTRL/VCOM: 0x90 had the best contrast on this panel (Marlin: 0x12)
init_overrides:
    0xC0 09 0B
    0xC5 00 90 80

# XPT2046 touch on SPI2 (CS PA7); PENIRQ is not wired, so it is polled.
# The board's SPI flash shares the bus (CS PB12) and is kept deselected.
[fsmc_touch]
cs_pin: PA7
spi_bus: spi2
spi_speed: 1000000
deselect_pins: PB12
