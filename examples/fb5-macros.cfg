# FB5 macro fixes. Included in printer.cfg right after macros/macros.cfg,
# so these sections override the ODUCCEU macros of the same name.

# Filament load/unload: 100 mm of filament ####################################
# KlipperScreen's Load/Unload buttons call LOAD_FILAMENT / UNLOAD_FILAMENT
# with SPEED=<its extrude speed in mm/min>.

[gcode_macro LOAD_FILAMENT]
description: Load filament: LENGTH (100 mm) = fast feed + slow purge
gcode:
    {% set length = params.LENGTH|default(100)|float %}
    {% set purge = [params.PURGE|default(30)|float, length]|min %}
    {% set speed = [params.SPEED|default(180)|float, 300]|min %}           # purge, at most 5 mm/s
    {% set temp = params.T|default(220)|float %}
    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
    LOW_TEMP_CHECK T={temp}
    M118 Loading filament ({length|int} mm)...
    M83                                                                     # relative extrusion
    G1 E{length - purge} F600                                               # feed to the hotend
    G1 E{purge} F{speed}                                                    # purge
    M400
    {% if printer.pause_resume.is_paused %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=loaded VALUE=True          # nozzle is primed now
    {% endif %}
    M118 Filament loaded
    BEEP
    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament: tip forming, then pull out LENGTH (100 mm) in total
gcode:
    {% set length = params.LENGTH|default(100)|float %}
    {% set temp = params.T|default(220)|float %}
    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
    LOW_TEMP_CHECK T={temp}
    M118 Unloading filament ({length|int} mm)...
    M83                                                                     # relative extrusion
    G1 E-5 F3600                                                            # to the cold zone
    G4 P3000
    G1 E5 F3600                                                             # push back to smash the string
    G1 E-15 F3600                                                           # out of the cold zone, fast
    G1 E-{length - 15} F600                                                 # the rest (net: -LENGTH)
    M400
    M118 Filament unloaded
    BEEP
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE

# Old names (M701/M702, FILAMENT_CHANGE/M600) use the same macros
[gcode_macro FILAMENT_LOAD]
gcode:
    LOAD_FILAMENT LENGTH={params.L|default(100)} T={params.T|default(220)}

[gcode_macro FILAMENT_UNLOAD]
gcode:
    UNLOAD_FILAMENT LENGTH={params.U|default(100)} T={params.T|default(220)}

# Pause / resume ###############################################################
# The original PAUSE saved PAUSE_STATE before checking whether the print was
# already paused: a second PAUSE overwrote the resume point with the parked
# position (Z +10 mm), so RESUME continued 10 mm above the part. It also
# retracted twice. The idle timeout (10 min) could switch off heaters and
# motors while the filament was being changed.

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: BASE_PAUSE
gcode:
    {% if printer.pause_resume.is_paused %}
        M118 Already paused
    {% else %}
        {% set E = printer["gcode_macro START_PRINT"].retract|float %}
        SET_IDLE_TIMEOUT TIMEOUT=1800                                       # 30 min to change filament
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=loaded VALUE=False
        BASE_PAUSE                                                          # saves PAUSE_STATE
        {% if printer.extruder.can_extrude %}
            G91
            G1 E-{E} F2100                                                  # retract
            G90
        {% else %}
            {action_respond_info("Extruder is not hot enough")}
        {% endif %}
        PARK
    {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: BASE_RESUME
variable_loaded: False
gcode:
    {% if not printer.pause_resume.is_paused %}
        M118 Not paused
    {% else %}
        {% set E = printer["gcode_macro START_PRINT"].retract|float %}
        {% set get_params = ('VELOCITY=' + params.VELOCITY) if 'VELOCITY' in params else "" %}
        {% if not printer.extruder.can_extrude %}
            {action_respond_info("Extruder is not hot enough")}
        {% elif not loaded %}                                               # undo the pause retract,
            G91                                                             # unless new filament
            G1 E{E} F2100                                                   # was loaded and purged
            G90
        {% endif %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=loaded VALUE=False
        SET_IDLE_TIMEOUT TIMEOUT=600
        BASE_RESUME {get_params}                                            # restores PAUSE_STATE, MOVE=1
    {% endif %}
